<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOSSIER · Speaking — Picture Story Drill</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2330;--mute:#5f6675;--line:#dcd8cd;--acc:#1f4e79;--hl:#fff1a8;--ok:#1e7a46;--bad:#b3261e;--act:#e6f0fa}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--ink:#e8eaf0;--mute:#9aa3b5;--line:#333a48;--acc:#7fb3e6;--hl:#5a4d0f;--ok:#5cc98a;--bad:#f28b82;--act:#22344a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 8px}
header h1{font-size:1.4rem;margin:0;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--mute);font-size:.92rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.88rem}
.bar select,.bar input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:210px}
.bar label{display:flex;align-items:center;gap:5px;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
nav a{padding:5px 12px;border:1px solid var(--line);border-radius:20px;color:var(--ink);text-decoration:none;font-size:.88rem;background:var(--card)}
.file{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:18px 0}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--acc)}
.file h2{margin:2px 0 6px;font-size:1.2rem}
.task{color:var(--mute);font-size:.92rem;margin:0 0 12px}
.file img{width:100%;max-width:520px;display:block;border:1px solid var(--line);border-radius:6px;margin:0 0 14px;background:#fff}
h3{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:20px 0 8px}
button{font:inherit;font-size:.86rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button.p{background:var(--acc);color:var(--card);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
ol.ans{list-style:none;padding:0;margin:0}
ol.ans li{display:flex;gap:10px;padding:10px 10px;border-bottom:1px solid var(--line);border-radius:6px}
ol.ans li.on,.card.on{background:var(--act)}
.n{flex:none;width:22px;font-weight:700;color:var(--acc)}
.en{font-size:1.02rem}
.vi{color:var(--mute);font-size:.92rem;margin-top:2px}
.nov .vi{display:none}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
.nohl mark{background:none;font-weight:inherit;padding:0}
.sp{flex:none;align-self:flex-start;padding:2px 8px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{width:46%}
.note{font-size:.92rem;margin:6px 0}
.note b{color:var(--acc)}
.zone{min-height:48px;border:1px dashed var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.zone:empty::before{content:attr(data-h);color:var(--mute);font-size:.85rem;padding:6px}
.card{padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card);font-size:.95rem}
.card.ok{border-color:var(--ok);background:transparent}
.card.no{border-color:var(--bad)}
.res{font-size:.9rem;margin-left:8px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
footer{color:var(--mute);font-size:.8rem;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>DOSSIER · SPEAKING — Picture Story Drill</h1>
  <p>4 chuỗi tranh · Sentence Order · Suggested Answer song ngữ EN–VI · Audio</p>
</header>

<div class="bar">
  <label>Voice <select id="voice"></select></label>
  <label>Speed <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.9"><span id="rv">0.9×</span></label>
  <label><input type="checkbox" id="thl" checked> Highlight</label>
  <label><input type="checkbox" id="tvi" checked> Tiếng Việt</label>
</div>
<nav id="nav"></nav>
<main id="main"></main>
<footer>DOSSIER Speaking · Audio dùng giọng đọc có sẵn của trình duyệt (Web Speech API).</footer>
</div>

<script>
const S=[
{title:"The Baby and the Guitars",task:"Describe the four pictures and tell the story. Use past or present tenses consistently.",
s:[
["In the first picture, a girl and a boy are **playing the guitar and singing** in the living room while a baby is **fast asleep** in a cradle next to them.","Ở tranh đầu, một bé gái và một bé trai đang chơi guitar và hát trong phòng khách, còn em bé đang ngủ say trong nôi bên cạnh."],
["Their mother **puts a finger to her lips** to tell them to be quiet.","Mẹ đặt ngón tay lên môi để bảo các con im lặng."],
["In the second picture, the children **sit at the table and read quietly**, but the baby seems to have **woken up**.","Ở tranh hai, hai đứa trẻ ngồi đọc sách yên lặng ở bàn, nhưng em bé dường như đã thức dậy."],
["So in the third picture, they **stand beside the cradle** and **sing softly** to calm the baby down.","Vì vậy ở tranh ba, chúng đứng cạnh nôi và hát nhẹ nhàng để dỗ em bé."],
["Finally, the baby looks **calm and happy**, and their mother **gazes down at** it with a smile.","Cuối cùng, em bé trông bình yên và vui vẻ, còn mẹ mỉm cười nhìn xuống em."],
["I think the children **learned a good lesson**: you can enjoy music **without disturbing** other people.","Tôi nghĩ hai đứa trẻ đã học được một bài học hay: có thể tận hưởng âm nhạc mà không làm phiền người khác."]],
ch:[["play the guitar and sing","chơi guitar và hát"],["fast asleep","ngủ say"],["calm (someone) down","dỗ / làm ai bình tĩnh lại"],["without disturbing","mà không làm phiền"]],
trap:"Không nói <i>sleep fast</i> — collocation đúng là <b>fast asleep</b>. Không nói <i>make a silence</i> — dùng <b>keep quiet / be quiet</b>.",
tip:"Mỗi tranh = 1 câu chính + 1 chi tiết (ai đang làm gì, cảm xúc). Kết bằng 1 câu nhận xét cá nhân."},

{title:"The Birthday Present",task:"Describe the four pictures and tell the story. Say what the girl expected and what happened.",
s:[
["In the first picture, it is a girl's birthday and she is **about to open** a big blue box; she is **hoping for** a laptop and some game controllers.","Ở tranh đầu, đó là sinh nhật của một cô bé và cô sắp mở một chiếc hộp xanh lớn; cô hy vọng có laptop và tay cầm chơi game."],
["However, when she **unwraps** it, she finds a guitar instead and looks **rather disappointed**.","Tuy nhiên, khi mở ra, cô thấy một cây guitar và trông khá thất vọng."],
["The man beside her **smiles and tries to cheer her up**.","Người đàn ông bên cạnh mỉm cười và cố làm cô vui lên."],
["In the third picture, the boy gives her a small present, and it turns out to be **something she really wanted**.","Ở tranh ba, cậu bé tặng cô một món quà nhỏ, và hóa ra đó là thứ cô thật sự muốn."],
["In the last picture, she is **playing a game with** the boy, while the man **strums the guitar** and the mother **brings in a birthday cake**.","Ở tranh cuối, cô đang chơi game với cậu bé, trong khi người đàn ông gảy guitar và người mẹ mang bánh sinh nhật vào."],
["In the end, everybody **has a great time** and the girl looks **delighted**.","Cuối cùng, mọi người đều vui vẻ và cô bé trông rất hài lòng."]],
ch:[["be about to + V","sắp sửa làm gì"],["hope for","hy vọng có được"],["cheer (someone) up","làm ai vui lên"],["it turns out to be…","hóa ra là…"]],
trap:"<i>Hope to a laptop</i> ✗ → <b>hope for a laptop</b> ✓. Không nhầm <i>unwrap</i> (bóc giấy gói) với <i>wrap</i> (gói).",
tip:"Tranh kể chuyện có “kỳ vọng → thực tế → giải quyết”. Dùng <b>However</b> / <b>turns out</b> để đánh dấu bước ngoặt."},

{title:"The Kite in the Tree",task:"Describe the four pictures and tell the story. Explain how the boy helped the family.",
s:[
["In the first picture, a boy is **climbing a tree** to **get hold of** a magazine that the wind has blown into the branches, while a family walks nearby.","Ở tranh đầu, một cậu bé đang trèo cây để lấy tờ tạp chí bị gió thổi vào cành, trong khi một gia đình đi bộ gần đó."],
["In the second picture, he notices a kite **stuck in the branches**, and the little girl below looks **very upset**.","Ở tranh hai, cậu thấy một chiếc diều mắc kẹt trên cành, và cô bé bên dưới trông rất buồn."],
["In the third picture, he **climbs higher** and **reaches out** for the kite while the family **points up and watches anxiously**.","Ở tranh ba, cậu trèo cao hơn và với tay lấy chiếc diều trong khi cả nhà chỉ lên và lo lắng theo dõi."],
["Finally, he **manages to free** the kite and **hands it back** to them.","Cuối cùng, cậu gỡ được chiếc diều và trao lại cho họ."],
["It is a sunny day and the family look **grateful**; they seem to be **thanking him**.","Hôm đó trời nắng và cả nhà trông rất biết ơn; họ có vẻ đang cảm ơn cậu."],
["I think it was **very kind of** the boy to help people he didn't even know.","Tôi nghĩ cậu bé thật tốt bụng khi giúp những người mà cậu còn không quen biết."]],
ch:[["get hold of","lấy được, nắm được"],["stuck in the branches","mắc kẹt trên cành"],["manage to + V","xoay xở làm được"],["It was kind of sb to + V","ai đó thật tốt khi…"]],
trap:"<i>He succeeded to free</i> ✗ → <b>He managed to free / succeeded in freeing</b> ✓. <i>Stuck on the tree</i> ✗ → <b>stuck in the tree</b>.",
tip:"Tranh 3 thường có hành động đang diễn ra → dùng <b>present continuous</b> hoặc <b>while + V-ing</b> để nối hai hành động."},

{title:"The Missing Puppy",task:"Describe the four pictures and tell the story. Say where the puppy was in the end.",
s:[
["In the first picture, a boy is **playing with a toy fire truck** when a man **arrives with a basket**; there is a puppy in it with a red ribbon.","Ở tranh đầu, một cậu bé đang chơi xe cứu hỏa đồ chơi thì một người đàn ông mang đến một chiếc giỏ; bên trong có chú chó con thắt nơ đỏ."],
["In the second picture, the children are **thrilled** and sit on the floor, **stroking the puppy**.","Ở tranh hai, hai đứa trẻ rất phấn khích và ngồi trên sàn vuốt ve chú chó con."],
["In the third picture, the puppy has **disappeared**: the boy **searches the cupboard** and the girl **looks behind the sofa**.","Ở tranh ba, chú chó đã biến mất: cậu bé tìm trong tủ còn cô bé nhìn phía sau ghế sofa."],
["They **wonder where it could be**, as there is only an empty basket and a small puddle on the floor.","Chúng tự hỏi nó có thể ở đâu, vì chỉ còn chiếc giỏ trống và một vũng nước nhỏ trên sàn."],
["In the last picture, they **finally find** the puppy **curled up inside** the toy truck.","Ở tranh cuối, cuối cùng chúng tìm thấy chú chó nằm cuộn tròn trong chiếc xe đồ chơi."],
["They look **relieved** and **a little amused**.","Chúng trông nhẹ nhõm và hơi buồn cười."]],
ch:[["be thrilled","rất phấn khích"],["stroke the puppy","vuốt ve chú chó"],["curl up inside","nằm cuộn tròn bên trong"],["look relieved","trông nhẹ nhõm"]],
trap:"<i>Excited</i> lặp lại quá nhiều — thay bằng <b>thrilled</b>, <b>delighted</b>. Không nhầm <i>search the cupboard</i> (tìm trong tủ) với <i>search for the puppy</i> (tìm chú chó).",
tip:"Tranh 3 → 4 là bước ngoặt (mất → tìm thấy). Dùng <b>finally</b> để đánh dấu kết quả và giữ mạch kể."}
];

const strip=t=>t.replace(/\*\*/g,''),hl=t=>t.replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
const $=id=>document.getElementById(id);
const main=$('main');

main.innerHTML=S.map((x,k)=>`
<section class="file" id="s${k}">
  <div class="tag">DOSSIER FILE ${String(k+1).padStart(2,'0')}</div>
  <h2>${x.title}</h2>
  <p class="task">${x.task}</p>
  <img src="images/story-${k+1}.jpeg" alt="Picture story ${k+1}">

  <h3>1 · Sentence Order Drill</h3>
  <p class="note">Bấm các câu theo đúng thứ tự kể chuyện. Bấm lại để bỏ câu ra.</p>
  <div class="zone" id="a${k}" data-h="Đáp án của bạn…"></div>
  <div class="zone" id="p${k}"></div>
  <div class="row"><button class="p" onclick="chk(${k})">Check</button><button onclick="shuf(${k})">Shuffle</button><span class="res" id="r${k}"></span></div>

  <h3>2 · Suggested Answer (EN–VI)</h3>
  <div class="row" style="margin-bottom:8px"><button class="p" onclick="playAll(${k})">▶ Play all</button><button onclick="stopAll()">■ Stop</button></div>
  <ol class="ans" id="l${k}">${x.s.map((q,i)=>`
    <li id="l${k}_${i}"><span class="n">${i+1}</span><div style="flex:1"><div class="en">${hl(q[0])}</div><div class="vi">→ ${q[1]}</div></div><button class="sp" onclick="playOne(${k},${i})" title="Nghe câu này">▶</button></li>`).join('')}
  </ol>

  <h3>Key Chunks</h3>
  <table>${x.ch.map(c=>`<tr><td><mark>${c[0]}</mark></td><td>${c[1]}</td></tr>`).join('')}</table>
  <h3>Trap &amp; Teacher Tip</h3>
  <p class="note"><b>TRAP</b> — ${x.trap}</p>
  <p class="note"><b>TEACHER TIP</b> — ${x.tip}</p>
</section>`).join('');
$('nav').innerHTML=S.map((x,k)=>`<a href="#s${k}">${k+1}. ${x.title}</a>`).join('');

/* ---------- Sentence order ---------- */
const st=S.map(x=>({pool:[],ans:[]}));
function shuf(k){
  const n=S[k].s.length;let a;
  do{a=[...Array(n).keys()].sort(()=>Math.random()-.5)}while(a.every((v,i)=>v===i));
  st[k]={pool:a,ans:[]};$('r'+k).textContent='';draw(k);
}
function draw(k,res){
  const card=(i,from,pos)=>`<div class="card ${res?(res[pos]?'ok':'no'):''}" onclick="mv(${k},${i},'${from}')">${strip(S[k].s[i][0])}</div>`;
  $('p'+k).innerHTML=st[k].pool.map(i=>card(i,'pool')).join('');
  $('a'+k).innerHTML=st[k].ans.map((i,p)=>card(i,'ans',p)).join('');
}
function mv(k,i,from){
  const t=st[k],to=from==='pool'?'ans':'pool';
  t[from]=t[from].filter(v=>v!==i);t[to].push(i);
  $('r'+k).textContent='';draw(k);
}
function chk(k){
  const t=st[k];
  if(t.ans.length<S[k].s.length){$('r'+k).textContent='Hãy sắp xếp hết các câu.';$('r'+k).style.color='var(--mute)';return}
  const res=t.ans.map((v,p)=>v===p),c=res.filter(Boolean).length;
  $('r'+k).textContent=c===res.length?'✓ Chính xác!':`${c}/${res.length} đúng vị trí`;
  $('r'+k).style.color=c===res.length?'var(--ok)':'var(--bad)';
  draw(k,res);
}
S.forEach((_,k)=>shuf(k));

/* ---------- Audio ---------- */
const syn=window.speechSynthesis;let voices=[],tok=0;
function loadV(){
  voices=syn.getVoices().filter(v=>/^en/i.test(v.lang));
  voices.sort((a,b)=>(/en-(GB|US)/i.test(b.lang)-/en-(GB|US)/i.test(a.lang)));
  $('voice').innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
}
if(syn){loadV();syn.onvoiceschanged=loadV}else{$('voice').outerHTML='<span>Trình duyệt không hỗ trợ audio</span>'}
$('rate').oninput=e=>$('rv').textContent=(+e.target.value).toFixed(2).replace(/0$/,'')+'×';
function clr(){document.querySelectorAll('ol.ans li.on').forEach(e=>e.classList.remove('on'))}
function speak(k,i,done){
  const el=$(`l${k}_${i}`),u=new SpeechSynthesisUtterance(strip(S[k].s[i][0])),v=voices[+$('voice').value];
  if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
  u.rate=+$('rate').value;
  u.onstart=()=>{clr();el.classList.add('on');el.scrollIntoView({block:'center',behavior:'smooth'})};
  u.onend=()=>{el.classList.remove('on');done&&done()};
  u.onerror=()=>el.classList.remove('on');
  syn.speak(u);
}
function stopAll(){tok++;syn&&syn.cancel();clr()}
function playOne(k,i){stopAll();speak(k,i)}
function playAll(k){
  stopAll();const my=tok;let i=0;
  const next=()=>{if(my!==tok||i>=S[k].s.length)return;speak(k,i++,next)};
  next();
}

/* ---------- Toggles ---------- */
$('thl').onchange=e=>document.body.classList.toggle('nohl',!e.target.checked);
$('tvi').onchange=e=>document.body.classList.toggle('nov',!e.target.checked);
</script>
</body>
</html>
